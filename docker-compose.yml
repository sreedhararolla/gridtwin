x-app-env: &app-env
  POSTGRES_DSN: postgresql://gridtwin:gridtwin@postgres:5432/gridtwin
  NATS_URL: nats://nats:4222
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: default
  CORS_ORIGINS: http://localhost:3000
  WORKER_REPLICAS: "2"
  SIMULATOR_REPLICAS: "2"
  HEARTBEAT_INTERVAL_SECONDS: "1"
  HEARTBEAT_STALE_SECONDS: "5"
  TASK_QUEUE: gridtwin-dispatch
  SETTLEMENT_POINT: LZ_HOUSTON
  FIXTURE_PATH: data/fixtures/rtm_spp_lz_houston_2025-12-10.csv
  REPLAY_SPEED: "60"
  SHARD_COUNT: "20"
  DEVICE_COUNT: "2000"
  DEVICE_ENERGY_KWH: "39.2"
  DEVICE_MAX_POWER_KW: "10.0"
  DEVICE_ROUND_TRIP_EFFICIENCY: "0.9"
  RESERVE_FLOOR_PCT: "0.20"
  INITIAL_SOC_PCT: "0.50"
  DEVICE_RESPONSE_NOISE_PCT: "0.02"
  DEVICE_FAULT_RATE: "0.001"
  FLEET_SEED: "42"
  TELEMETRY_PERIOD_REPLAY_SECONDS: "60"
  TELEMETRY_STALE_HEARTBEATS: "3"
  TELEMETRY_FLUSH_SECONDS: "1.0"
  NAIVE_DISCHARGE_THRESHOLD_USD: "90.0"
  NAIVE_CHARGE_THRESHOLD_USD: "20.0"
  DISPATCH_TIMEOUT_SECONDS: "5.0"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gridtwin
      POSTGRES_PASSWORD: gridtwin
      POSTGRES_DB: gridtwin
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridtwin -d gridtwin"]
      interval: 3s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.10-alpine
    command: ["-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8222/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.24.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: gridtwin
      POSTGRES_PWD: gridtwin
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233"]

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports: ["8080:8080"]

  api:
    build: .
    command: ["uvicorn", "gridtwin.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      temporal:
        condition: service_started
    volumes: ["./data:/app/data:ro"]
    ports: ["8000:8000"]

  worker-a:
    build: .
    command: ["python", "-m", "gridtwin.worker.main"]
    environment:
      <<: *app-env
      INSTANCE_ID: worker-a
    volumes: ["./data:/app/data:ro"]
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started

  worker-b:
    build: .
    command: ["python", "-m", "gridtwin.worker.main"]
    environment:
      <<: *app-env
      INSTANCE_ID: worker-b
    volumes: ["./data:/app/data:ro"]
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started

  simulator-a:
    build: .
    command: ["python", "-m", "gridtwin.simulator.main"]
    environment:
      <<: *app-env
      INSTANCE_ID: simulator-a
      SHARD_IDS: shard-0,shard-1,shard-2,shard-3,shard-4,shard-5,shard-6,shard-7,shard-8,shard-9
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  simulator-b:
    build: .
    command: ["python", "-m", "gridtwin.simulator.main"]
    environment:
      <<: *app-env
      INSTANCE_ID: simulator-b
      SHARD_IDS: shard-10,shard-11,shard-12,shard-13,shard-14,shard-15,shard-16,shard-17,shard-18,shard-19
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  telemetry:
    build: .
    command: ["python", "-m", "gridtwin.telemetry.main"]
    environment:
      <<: *app-env
      INSTANCE_ID: telemetry
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
