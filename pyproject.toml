[project]
name = "gridtwin"
version = "0.1.0"
description = "GridTwin: fault-tolerant VPP dispatch orchestrator"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "psycopg[binary]>=3.2",
  "nats-py>=2.9",
  "temporalio>=1.7",
  "duckdb>=1.1",
  "gridstatus>=0.30",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "scipy>=1.14",
  "lightgbm>=4.7.0",
  "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
  "ruff>=0.7",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "psutil>=7.2.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["e2e: compose mode, needs the full stack running (make up); run by make test-e2e"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridtwin"]
